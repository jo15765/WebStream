services:
  webstream:
    build: .
    ports:
      - "8080:8080"
    environment:
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      PORT: 8080
      NODE_ENV: production
    volumes:
      - webstream-data:/app/data
      - webstream-recordings:/app/recordings
    restart: unless-stopped

volumes:
  webstream-data:
  webstream-recordings:
